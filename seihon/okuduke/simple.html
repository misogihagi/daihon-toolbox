<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奥付 — 霧の桟橋で待っている</title>
  <style>
    :root {
      --paper: #f6f2ea;
      --ink: #1d1c1a;
      --muted: #5f5b54;
      --shu: #a63a2b;
      --rule: rgba(29, 28, 26, 0.24);
      --rule-light: rgba(29, 28, 26, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #dcd5c7 0%, #c4bbb0 100%);
      padding: 36px 16px;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      color: var(--ink);
    }

    /* 単ページ（奥付ページ） */
    .colophon-page {
      position: relative;
      width: min(440px, 94vw);
      min-height: 600px;
      background: var(--paper);
      border-radius: 3px;
      box-shadow:
        0 20px 45px rgba(29, 28, 26, 0.25),
        0 2px 6px rgba(29, 28, 26, 0.12);
      padding: 46px 40px 36px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    /* 紙の微細な質感 */
    .colophon-page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(29, 28, 26, 0.03) 1px, transparent 0);
      background-size: 5px 5px;
      pointer-events: none;
    }

    .colophon-box {
      position: relative;
      z-index: 1;
    }

    /* 書名ブロック */
    .book-header {
      padding-bottom: 16px;
      border-bottom: 1.5px solid var(--ink);
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .book-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.18em;
      line-height: 1.4;
    }

    .book-series {
      display: block;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    /* 検印風の小さな朱印 */
    .seal {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--shu);
      border-radius: 2px;
      color: var(--shu);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0;
      opacity: 0.88;
    }

    /* 発行日・版数 */
    .edition-history {
      font-size: 12.5px;
      line-height: 1.9;
      letter-spacing: 0.1em;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 16px;
    }

    /* 書誌データ一覧（dl / dt / dd） */
    .meta-list {
      display: grid;
      grid-template-columns: 6.5em 1fr;
      row-gap: 9px;
      column-gap: 12px;
      font-size: 12.5px;
      line-height: 1.75;
      letter-spacing: 0.08em;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 14px;
    }

    .meta-list dt {
      color: var(--muted);
      text-align: justify;
      text-align-last: justify;
    }

    .meta-list dd {
      color: var(--ink);
    }

    .sub-detail {
      display: block;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ISBN・著作権表記・乱丁落丁案内 */
    .legal-notes {
      font-size: 10.5px;
      line-height: 1.8;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .isbn-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-family: "Courier New", Consolas, monospace;
      font-size: 11px;
      color: var(--ink);
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }

    .copyright {
      margin-top: 8px;
      font-size: 11px;
      color: var(--ink);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <article class="colophon-page" aria-label="奥付">
    <div class="colophon-box">
      <header class="book-header">
        <div>
          <span class="book-series">現代文学選</span>
          <h1 class="book-title">霧の桟橋で待っている</h1>
        </div>
        <div class="seal" aria-hidden="true">朝倉<br />之印</div>
      </header>

      <div class="edition-history">
        <p>二〇二六年十一月二十一日 第一刷発行</p>
      </div>

      <dl class="meta-list">
        <dt>著  者</dt>
        <dd>朝倉 静子</dd>

        <dt>発 行 者</dt>
        <dd>神田 誠一</dd>

        <dt>発 行 所</dt>
        <dd>
          株式会社 青霧書房
          <span class="sub-detail">〒101-0051 東京都千代田区神田神保町二丁目十四番地</span>
        </dd>

        <dt>編  集</dt>
        <dd>佐伯 恒一</dd>

        <dt>装丁設計</dt>
        <dd>三輪 澄江</dd>

        <dt>印刷・製本</dt>
        <dd>精興堂印刷株式会社</dd>
      </dl>

      <footer class="legal-notes">
        <div class="isbn-row">
          <span>ISBN978-4-901234-56-7</span>
          <span>C0093 ¥1600E</span>
        </div>
        <p>落丁・乱丁本はお手数ですが小社制作部までお送りください。送料小社負担にてお取り替えいたします。</p>
        <p class="copyright">&copy; 2026 Shizuko Asakura, Printed in Japan</p>
      </footer>
    </div>
  </article>
</body>
</html>
